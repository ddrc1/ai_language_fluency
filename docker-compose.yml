services:
    backend-app:
        container_name: language-fluency-app
        build:
            dockerfile: ./docker/Dockerfile.backend
        command: >
            sh -c "
                uv run manage.py collectstatic --noinput &&
                uv run manage.py makemigrations &&
                uv run manage.py migrate &&
                uv run manage.py load_language_practice &&
                uv run python docker/create_superuser.py &&
                uv run gunicorn core.wsgi:application --workers 4 --bind 0.0.0.0:8000
            "
        volumes:
            - ./staticfiles:/app/staticfiles
        env_file:
            - .env
        restart: unless-stopped
        networks:
            - language-fluency-network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://127.0.0.1:8000"]
            interval: 10s
            timeout: 5s
            retries: 3

    rabbitmq:
        container_name: language-fluency-rabbitmq
        image: rabbitmq:management-alpine
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        restart: unless-stopped
        networks:
            - language-fluency-network


    celery:
        container_name: language-fluency-celery
        build:
            dockerfile: ./docker/Dockerfile.celery
        command: uv run celery -A core worker -l INFO
        env_file:
            - .env
        restart: unless-stopped
        networks:
            - language-fluency-network
        depends_on:
            - rabbitmq
            - backend-app


    celery-beat:
        container_name: language-fluency-celery-beat
        build:
            dockerfile: ./docker/Dockerfile.celery-beat
        command: uv run celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
        restart: unless-stopped
        env_file:
            - .env
        networks:
            - language-fluency-network
        depends_on:
            - rabbitmq
            - backend-app

    
    nginx:
        image: nginx:latest
        container_name: language-fluency-nginx
        volumes:
            - ./docker/nginx.conf:/etc/nginx/nginx.conf
            - ./staticfiles:/var/www/app/staticfiles
        ports:
            - 8200:80
        restart: unless-stopped
        networks:
            - language-fluency-network
        depends_on:
            - backend-app

networks:
    language-fluency-network:
        driver: bridge