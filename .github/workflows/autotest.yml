name: AutoTester

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports: ["5432:5432"]
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v10.1.0
              with:
                enable-cache: true
            - name: Install dependencies
              run: uv sync --locked
            - name: Run tests
              env:
                DB_NAME: postgres
                DB_USER: postgres
                DB_PASSWORD: postgres
                DB_HOST: localhost
                DB_PORT: "5432"
              run: uv run manage.py test apps